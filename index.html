<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MonAmie Art Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=Nunito:wght@400;600;800;900&amp;family=Caveat:wght@600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#6A253C;--card:#F3ECD0;--ink:#F3ECD0;--mut:#dccdc3;--acc:#C65727;--m:#6A253C;--line:#F3ECD033;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-behavior:smooth;scroll-padding-top:70px;background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Nunito,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.logo{font-family:'DM Serif Display',Georgia,serif;margin:0;font-weight:400}
a{color:inherit}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;flex-wrap:wrap}
.logo{font-size:22px;text-decoration:none}.logo span{color:#EBC4F1;font:800 10px Nunito,sans-serif;letter-spacing:.22em;text-transform:uppercase;margin-left:6px}
nav .l a{margin-left:16px;text-decoration:none;color:var(--mut);font-weight:600;font-size:14px}
nav .l a:hover{color:#C9D17C}
section,.hero{position:relative;overflow:hidden}
section>*,.hero>*{position:relative;z-index:1}
section{max-width:1000px;margin:0 auto;padding:44px 20px}
.dec{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;width:92px;height:auto;opacity:.5;pointer-events:none}
section>.dec,.hero>.dec{position:absolute;z-index:0}
@media(max-width:600px){.dec{width:56px;opacity:.38}}
.hero{text-align:center;padding:40px 20px 34px}
.mascot{height:200px;width:auto;margin-bottom:6px;filter:drop-shadow(2px 0 0 #F3ECD0) drop-shadow(-2px 0 0 #F3ECD0) drop-shadow(0 2px 0 #F3ECD0) drop-shadow(0 -2px 0 #F3ECD0)}
.nl{height:38px;width:auto;vertical-align:middle;margin-right:8px;filter:drop-shadow(1px 0 0 #F3ECD0) drop-shadow(-1px 0 0 #F3ECD0) drop-shadow(0 1px 0 #F3ECD0) drop-shadow(0 -1px 0 #F3ECD0)}
.hero h1{font-size:clamp(50px,14vw,96px);line-height:1}.studio{font-weight:800;letter-spacing:.38em;text-transform:uppercase;font-size:clamp(12px,3.4vw,17px);color:#EBC4F1;margin-top:8px;padding-left:.38em}
.hand{font-family:Caveat,cursive;font-size:26px;color:#C9D17C;margin-top:4px}
.hero p{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(24px,6vw,32px);line-height:1.2;color:#F3ECD0;max-width:520px;margin:16px auto 22px;text-wrap:balance}.hero p .g{color:#C9D17C}
.btn{display:inline-block;background:var(--acc);color:#fff;padding:10px 22px;border-radius:99px;text-decoration:none;font-weight:800;font-size:14px;border:0;cursor:pointer;font-family:inherit;margin:3px}
.btn.o{background:none;color:var(--ink);border:1.5px solid var(--ink)}
h2{font-size:32px;margin-bottom:6px}.sub{color:var(--mut);margin:0 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1.5px solid #F3ECD066;background:none;color:var(--ink);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.on{background:#EBC4F1;color:var(--m);border-color:#EBC4F1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--card);color:var(--m);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:#848DC8;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--m)}
.card:nth-child(4n+2) .ph{background:#EBC4F1}.card:nth-child(4n+3) .ph{background:#C9D17C}.card:nth-child(4n+4) .ph{background:#C65727}
.ph img,.card img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:11px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb small{color:var(--acc);font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.cb b{font-family:'DM Serif Display',serif;font-weight:400;font-size:17px;line-height:1.2}
.cb p{margin:0;opacity:.8;font-size:13px;flex:1;white-space:pre-line}.price{font-weight:800}
.cb .btn{margin-top:8px;text-align:center;padding:8px 12px;font-size:13px}
.ws{display:flex;gap:16px;background:var(--card);color:var(--m);border-radius:16px;padding:16px;margin-bottom:14px;align-items:flex-start;flex-wrap:wrap}
.date{background:var(--m);color:#F3ECD0;border-radius:14px;padding:10px 14px 8px;text-align:center;min-width:76px;font-family:Nunito,sans-serif;box-shadow:3px 3px 0 #F26B2D}.date b{display:block;font-size:36px;line-height:1;font-weight:900}.date span{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
.ws .i{flex:1;min-width:200px}.ws h3{font-size:20px}.ws .m{opacity:.75;font-size:14px}
.ws.c0{background:#EBC4F1}.ws.c1{background:#848DC8;color:#3e1526}.ws.c1 .m{opacity:.85}.ws .i p,.about p{white-space:pre-line}.ws .i p.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.more{background:none;border:0;color:inherit;font:800 13px Nunito,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0 0}.ws .btn{background:#F26B2D;color:#3a1222}.ws.past{opacity:.6}
.gal{flex-basis:100%;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}.gal img{width:78px;height:78px;object-fit:cover;border-radius:10px;border:2px solid #fff8;cursor:zoom-in;transform:rotate(-2deg)}.gal img:nth-child(even){transform:rotate(2deg)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}.th{position:relative}.th img{width:72px;height:72px;object-fit:cover;border-radius:8px}.ed .th .x{position:absolute;top:-6px;right:-6px;background:#c0262d;color:#fff;border-radius:50%;width:20px;height:20px;padding:0;line-height:20px;font-size:11px}.ws .btn{align-self:center}
.ic{width:clamp(32px,9vw,46px);height:auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.ic:nth-child(even){transform:rotate(-8deg)}.ic:nth-child(3n){transform:rotate(7deg)}
.strip{display:flex;justify-content:center;gap:clamp(8px,3.5vw,30px);padding:10px 20px}.empty{color:var(--mut);padding:20px;border:1.5px dashed #F3ECD066;border-radius:14px;text-align:center}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.wave{display:block;line-height:0;margin-top:20px}.wave svg{display:block;width:100%;height:46px}
footer{background:#848DC8;color:var(--m);font-weight:700;text-align:center;font-size:13px;padding:6px 20px calc(60px + env(safe-area-inset-bottom,0px))}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:var(--m);display:none;gap:10px;align-items:center;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;font-size:14px}
#bar.on{display:flex}
.ed{background:var(--card);color:var(--m);border:1.5px dashed var(--acc);border-radius:14px;padding:14px;margin-bottom:14px;display:grid;gap:8px}
.ed label{font-size:12px;color:var(--m);display:grid;gap:3px}
.ed input,.ed textarea{font:inherit;padding:8px;border:1px solid #6A253C44;border-radius:8px;background:#fff;color:var(--m);width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ed img{max-width:110px;border-radius:8px}.ed .x{background:none;border:0;color:#c0262d;cursor:pointer;justify-self:end;font:inherit}
.about{display:grid;gap:16px;max-width:640px}.about p{margin:0}.about p.lead{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(20px,5vw,24px);line-height:1.3;color:#EBC4F1}
.mo{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}.mb{background:#F3ECD0;color:#6A253C;border-radius:18px;padding:20px;max-width:420px;width:100%}.mb h3{font-size:24px;margin-bottom:6px}.mb p{margin:0 0 10px;font-size:14px}.mb textarea{width:100%;font:13px/1.4 Nunito,sans-serif;padding:10px;border-radius:10px;border:1px solid #6A253C44;background:#fff;color:#6A253C;resize:none}.mbb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn.o2{background:none;color:#6A253C;border:1.5px solid #6A253C}.hl{outline:3px solid #EBC4F1;outline-offset:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{border:0;border-radius:16px;overflow:hidden;cursor:pointer;font-family:inherit;color:var(--m);text-align:left;padding:0;background:#EBC4F1;display:flex;flex-direction:column;transition:transform .15s}.tile:hover{transform:translateY(-3px)}
.tile.t1{background:#848DC8;color:#3a1222}.tile.t2{background:#C9D17C}.tile.t3{background:#F3ECD0}
.tp{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}.tp img{width:100%;height:100%;object-fit:cover;display:block}
.tb{padding:10px 12px 12px}.tb b{display:block;font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:20px;line-height:1.15}.tb span{font-size:12px;font-weight:800;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
.back{background:none;border:0;color:inherit;font:800 14px Nunito,sans-serif;cursor:pointer;padding:0;margin-bottom:8px;text-decoration:underline;text-underline-offset:3px}.catt{font-size:28px;margin-bottom:14px;color:#EBC4F1}
.gb{display:flex;gap:6px;flex-wrap:wrap}.btn.sm{padding:5px 12px;font-size:12px;margin:0}.mv{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mv .x{margin-left:auto}.cg{margin-bottom:22px}
.card.sold .ph{opacity:.55;filter:grayscale(.5)}.ph{position:relative}.ribbon{position:absolute;top:8px;left:8px;z-index:1;background:#3a1222;color:#F3ECD0;font:900 11px Nunito,sans-serif;letter-spacing:.12em;padding:4px 10px;border-radius:99px}.soldb{margin-top:8px;text-align:center;font-weight:800;font-size:13px;opacity:.6}
.cb .btn+.btn{margin-top:6px}.ck{display:flex!important;flex-direction:row;gap:8px;align-items:center;font-size:14px!important}.ck input{width:auto!important}
#cartbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;background:#F26B2D;color:#3a1222;border:0;border-radius:99px;padding:12px 18px;font:800 15px Nunito,sans-serif;box-shadow:0 4px 14px #0006;cursor:pointer;display:none}#cartbtn.on{display:block}
.mb{max-height:90vh;overflow:auto}.cr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #6A253C22}.ci{flex:1}.ci b{display:block;font-weight:800}.ci small{opacity:.75}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid #6A253C;background:none;color:#6A253C;font:800 16px Nunito,sans-serif;cursor:pointer;line-height:1;padding:0}.qty span{min-width:18px;text-align:center;font-weight:800}
.rm{background:none;border:0;color:#6A253C;opacity:.6;cursor:pointer;font-size:14px}.tot{display:flex;justify-content:space-between;padding:12px 0 4px;font-size:18px}.fine{font-size:12px!important;opacity:.75}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#3a1222;color:#F3ECD0;padding:10px 18px;border-radius:99px;font:800 14px Nunito,sans-serif;z-index:40}
.closed{align-self:center;font-weight:800;font-size:13px;padding:7px 14px;border:1.5px solid currentColor;border-radius:99px;opacity:.75}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style></head><body>

IiID/9k=","link":""}],"workshops":[{"id":"w1","title":"Acrylics & Afternoon Tea","date":"2026-11-22","time":"3:00 PM to 5:00 PM","place":"Osian Chlorophyll, Chennai","price":"₹1,800","desc":"Looking for a creative escape? Join us for an immersive painting experience designed to awaken your senses. In this acrylic on canvas workshop, you will learn to capture light and color on canvas at your own pace. But this is more than just an art class, it is a curated social event.\n\nTake a break at our bespoke tea table, where you can craft your own signature blend from six distinct flavors. Sip your custom brew, enjoy a selection of fine cookies, and return to your easel inspired. With a brush in one hand and a warm cup in the other, this is the perfect blend of creative focus and sophisticated relaxation.","link":""},{"id":"w2","title":"Paint Your Tote, Make Your Charm, Sip Your Soda","date":"2026-12-13","time":"3:00 PM to 5:00 PM","place":"Osian Chlorophyll, Chennai","price":"₹2250","desc":"Ready to make something you'll actually want to show off? Grab a plain tote and turn it into a one-of-a-kind masterpiece. No artistic pedigree required. We'll hand you fabric paints, brushes, and all the supplies, then turn you loose to doodle, splatter, and design a bag that screams you. Then hop over to the charm station and whip up a customised charm, clip it to your new bag, your keys, or surprise someone with it.\n\nOh, and did we mention the soda station? It's open the whole session. Mix your own fizzy concoction from a rainbow of flavors and bubbles, and sip while you paint, craft, and chat. It's relaxed, it's social, and it's a whole lot of fun. No experience needed. Just bring your ideas, your friends, and your thirst for something good.","link":""}]}</script>

 ${strip(2)}<section id="about"><h2>About</h2><div class="about">${D.about.split(/\n\s*\n/).map((t,i)=>`<p class="${i?'':'lead'}">${esc(t.trim())}</p>`).join('')}</div><div class="soc">${soc()}</div></section>
 <div class="wave"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M0 20Q12.5 0 25 20T50 20T75 20T100 20V40H0Z" fill="#848DC8"/></svg></div><footer>© ${new Date().getFullYear()} MonAmie Art Studio</footer>`;fit();
}
const inp=(l,k,v,t='text')=>`<label>${l}<input type="${t}" data-k="${k}" value="${esc(v)}"></label>`;
function editor(){
 const imgf=(k,v)=>`${v?`<img src="${v}">`:''}<label>Photo<input type="file" accept="image/*" data-img="${k}"></label>`;
 $('#app').innerHTML=`<section><h2>Edit your site</h2><p class="sub">Change anything, then tap <b>Download updated file</b> at the bottom.</p>
 <div class="ed"><h3>Basics</h3>${inp('Tagline','tagline',D.tagline)}<label>About you<textarea rows="5" data-k="about">${esc(D.about)}</textarea></label>
 <div class="row">${inp('Instagram handle','socials.instagram',D.socials.instagram)}${inp('Email (optional)','socials.email',D.socials.email)}${inp('Threads handle','socials.threads',D.socials.threads)}${inp('Pinterest handle','socials.pinterest',D.socials.pinterest)}${inp('WhatsApp number (optional, with country code, e.g. 919XXXXXXXXX)','socials.whatsapp',D.socials.whatsapp||'')}</div></div>
 <div class="sec-h"><h3>Workshops</h3><button class="btn" id="addw">+ Add workshop</button></div><br>
 ${D.workshops.map((w,i)=>`<div class="ed"><button class="x" data-delw="${i}">Delete</button>${inp('Title',`workshops.${i}.title`,w.title)}<div class="row">${inp('Date',`workshops.${i}.date`,w.date,'date')}${inp('Time',`workshops.${i}.time`,w.time)}${inp('Place',`workshops.${i}.place`,w.place)}${inp('Price',`workshops.${i}.price`,w.price)}</div><label>Details<textarea rows="2" data-k="workshops.${i}.desc">${esc(w.desc)}</textarea></label>${inp('Booking link (optional)',`workshops.${i}.link`,w.link)}<label class="ck"><input type="checkbox" data-k="workshops.${i}.closed" ${w.closed?'checked':''}> Booking closed</label><label>Photos (pick several; they show as a small row)<input type="file" accept="image/*" multiple data-wimgs="${i}"></label><div class="thumbs">${(w.imgs||[]).map((im,j)=>`<span class="th"><img src="${im}"><button class="x" data-dimg="${i}.${j}">✕</button></span>`).join('')}</div></div>`).join('')}
 <div class="sec-h"><h3>Shop items</h3><button class="btn" id="addp">+ Add item in a new category</button></div><p class="sub">Use ↑ ↓ to arrange items inside a category. Use Category ↑ ↓ to arrange the category buttons on the shop page. Changing an item’s category moves it the next time the list refreshes.</p>
 ${cats().map((c,gi)=>`<div class="cg"><div class="sec-h"><h3>${esc(c)}</h3><div class="gb"><button class="btn sm o" data-ren="${gi}">Rename</button><button class="btn sm o" data-cmv="${gi}|-1">Category ↑</button><button class="btn sm o" data-cmv="${gi}|1">Category ↓</button><button class="btn sm" data-addp="${gi}">+ Add here</button></div></div><br>${D.products.map((p,i)=>cf(p)!==c?'':`<div class="ed" id="ed-${p.id}"><div class="mv"><button class="btn sm o2" data-mvp="${i}|-1">↑ Move up</button><button class="btn sm o2" data-mvp="${i}|1">↓ Move down</button><button class="x" data-delp="${i}">Delete</button></div><div class="row">${inp('Name',`products.${i}.name`,p.name)}${inp('Category (Paintings, Prints, Merch, Clay…)',`products.${i}.cat`,p.cat)}${inp('Price',`products.${i}.price`,p.price)}</div><label>Description<textarea rows="2" data-k="products.${i}.desc">${esc(p.desc)}</textarea></label>${inp('Buy link (optional, leave blank to use Instagram DM)',`products.${i}.link`,p.link)}<label class="ck"><input type="checkbox" data-k="products.${i}.sold" ${p.sold?'checked':''}> Sold out / not available</label>${imgf(`products.${i}.img`,p.img)}</div>`).join('')}</div>`).join('')}
 <p class="sub">Past-dated workshops move to “Past workshops” automatically.</p></section>`;
}
function setK(k,v){const a=k.split('.');let o=D;while(a.length>1)o=o[a.shift()];o[a[0]]=v}
function show(){edit?editor():view();$('#bar').classList.toggle('on',edit);updCart();if(focus){const el=document.getElementById('ed-'+focus);if(el)el.scrollIntoView({block:'center'});focus=null}}
function shrink(f,mx=800){return new Promise((res,rej)=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=u})}
document.addEventListener('click',e=>{const t=e.target;
 if(t.id==='go'){e.preventDefault();edit=true;show();scrollTo(0,0)}
 if(t.dataset.add){cart[t.dataset.add]=Math.min(99,(cart[t.dataset.add]||0)+1);saveCart();updCart();toast('Added to cart ✓')}
 if(t.closest&&t.closest('#cartbtn'))openCart();
 const cb=t.closest&&t.closest('[data-c]');if(cb){cat=cb.dataset.c;view();document.getElementById('shop').scrollIntoView()}
 if(t.id==='addp'){const np={id:uid('p'),name:'New item',cat:'New category',price:'',desc:'',img:'',link:''};D.products.push(np);focus=np.id;show()}
 if(t.dataset.addp!==undefined){const c=cats()[+t.dataset.addp];let ix=-1;D.products.forEach((p,i)=>{if(cf(p)===c)ix=i});const np={id:uid('p'),name:'New item',cat:c,price:'',desc:'',img:'',link:''};D.products.splice(ix+1,0,np);focus=np.id;show()}
 if(t.dataset.mvp){const[i,d]=t.dataset.mvp.split('|').map(Number),c=cf(D.products[i]);let j=i+d;while(j>=0&&j<D.products.length&&cf(D.products[j])!==c)j+=d;if(j>=0&&j<D.products.length){const m=D.products[i];[D.products[i],D.products[j]]=[D.products[j],D.products[i]];focus=m.id;show()}}
 if(t.dataset.cmv){const[g,d]=t.dataset.cmv.split('|').map(Number),o=cats(),k=g+d;if(k>=0&&k<o.length){[o[g],o[k]]=[o[k],o[g]];D.products=o.flatMap(c=>D.products.filter(p=>cf(p)===c));const f=D.products.find(p=>cf(p)===o[k]);focus=f&&f.id;show()}}
 if(t.dataset.ren){const c=cats()[+t.dataset.ren],n=prompt('Rename this category to:',c);if(n&&n.trim()){D.products.forEach(p=>{if(cf(p)===c)p.cat=n.trim()});show()}}
 if(t.id==='addw'){D.workshops.unshift({id:uid('w'),title:'New workshop',date:today,time:'',place:'',price:'',desc:'',link:''});show()}
 if(t.dataset.delp&&confirm('Delete this item?')){D.products.splice(+t.dataset.delp,1);show()}
 if(t.dataset.delw&&confirm('Delete this workshop?')){D.workshops.splice(+t.dataset.delw,1);show()}
 const am=t.closest&&t.closest('a[data-msg]');if(am){e.preventDefault();askDM(am.dataset.msg,am.href);return}
 if(t.classList.contains('more')){const p=t.previousElementSibling;p.dataset.open=p.dataset.open==='1'?'0':'1';fit()}
 if(t.tagName==='IMG'&&t.closest('.gal'))lb(t.src);
 if(t.dataset.dimg){const[i,j]=t.dataset.dimg.split('.').map(Number),y=scrollY;D.workshops[i].imgs.splice(j,1);show();scrollTo(0,y)}
 if(t.id==='exit'){edit=false;show()}
 if(t.id==='pub')publish()});
document.addEventListener('input',e=>{if(e.target.dataset.k)setK(e.target.dataset.k,e.target.type==='checkbox'?e.target.checked:e.target.value)});
document.addEventListener('change',async e=>{const t=e.target,k=t.dataset.img;
 if(k&&t.files[0]){try{setK(k,await shrink(t.files[0]));show()}catch{alert('Could not read that image.')}}
 if(t.dataset.wimgs!==undefined&&t.files.length){const w=D.workshops[+t.dataset.wimgs],y=scrollY;w.imgs=w.imgs||[];for(const f of t.files){try{w.imgs.push(await shrink(f,520))}catch{}}show();scrollTo(0,y)}});
const fmtD=d=>{const[y,m,dd]=(d||'').split('-');return y?`${+dd} ${MON[+m-1]} ${y}`:''};
const base=()=>location.href.split('#')[0];
const msgP=p=>`Hi MonAmie! I’m interested in “${p.name}”${p.price?` (${p.price})`:''}.\nSee it here: ${base()}#item-${p.id}`;
const msgW=w=>`Hi MonAmie! I’d like to book the workshop “${w.title}” on ${fmtD(w.date)}${w.time?` at ${w.time}`:''}.\nDetails: ${base()}#ws-${w.id}`;
function askDM(msg,href){
 try{navigator.clipboard.writeText(msg)}catch{}
 const wa=(D.socials.whatsapp||'').replace(/\D/g,'');
 const d=document.createElement('div');d.className='mo';
 d.innerHTML=`<div class="mb"><h3>Almost there ✿</h3><p>I’ve copied a message for you. Open Instagram and paste it into the chat, so I know which one you’re interested in.</p><textarea readonly rows="4">${esc(msg)}</textarea><div class="mbb"><a class="btn" href="${esc(href)}" target="_blank" rel="noopener">Open Instagram</a>${wa?`<a class="btn o2" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp instead</a>`:''}<button class="btn o2" data-copy>Copy again</button><button class="btn o2" data-close>Close</button></div></div>`;
 d.onclick=e=>{const t=e.target;if(t===d||t.dataset.close!==undefined)d.remove();if(t.dataset.copy!==undefined){d.querySelector('textarea').select();try{navigator.clipboard.writeText(msg)}catch{document.execCommand('copy')}t.textContent='Copied ✓'}};
 document.body.appendChild(d);
}
function goHash(){const h=location.hash.slice(1);if(/^(item|ws)-/.test(h)){if(h.startsWith('item-')&&!edit){const q=D.products.find(x=>'item-'+x.id===h);if(q){cat=cf(q);view()}}const el=document.getElementById(h);if(el){el.scrollIntoView({block:'center'});el.classList.add('hl')}}}
let cart={};try{cart=JSON.parse(localStorage.getItem('mmcart')||'{}')}catch{}
const saveCart=()=>{try{localStorage.setItem('mmcart',JSON.stringify(cart))}catch{}};
const num=p=>{const m=String(p.price||'').match(/^\D*([0-9][0-9,]*(?:\.[0-9]+)?)\s*(?:\/-|only)?\s*$/i);return m?parseFloat(m[1].replace(/,/g,'')):NaN};
const inr=n=>'₹'+n.toLocaleString('en-IN');
const lines=()=>Object.keys(cart).map(id=>({p:D.products.find(x=>x.id===id),q:cart[id]})).filter(l=>l.p&&!l.p.sold&&l.q>0);
function cartMsg(){let t=0,u=0;const rows=lines().map(({p,q})=>{const n=num(p);if(isNaN(n))u++;else t+=n*q;return '• '+q+' × '+p.name+(isNaN(n)?' (price to be confirmed)':q>1?' ('+inr(n)+' each)':' ('+inr(n)+')')+'\n   '+base()+'#item-'+p.id});return 'Hi MonAmie! I’d like to order:\n'+rows.join('\n')+'\nTotal: '+inr(t)+(u?' + items to be priced':'')+'\nPlease let me know about payment and delivery. Thank you!'}
function updCart(){const b=$('#cartbtn');if(!b)return;Object.keys(cart).forEach(id=>{const p=D.products.find(x=>x.id===id);if(!p||p.sold)delete cart[id]});const n=Object.values(cart).reduce((a,v)=>a+v,0);b.textContent='🛍 Cart ('+n+')';b.classList.toggle('on',n>0&&!edit)}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
function openCart(){
 const d=document.createElement('div');d.className='mo';const wa=(D.socials.whatsapp||'').replace(/\D/g,'');
 const draw=()=>{const L=lines();if(!L.length){d.remove();updCart();return}let tot=0,unk=0;
  const rows=L.map(({p,q})=>{const n=num(p);if(isNaN(n))unk++;else tot+=n*q;return `<div class="cr"><div class="ci"><b>${esc(p.name)}</b><small>${isNaN(n)?'Price confirmed in chat':inr(n)+(q>1?' each':'')}</small></div><div class="qty"><button data-q="${esc(p.id)}|-1">−</button><span>${q}</span><button data-q="${esc(p.id)}|1">+</button></div><button class="rm" data-rm="${esc(p.id)}" aria-label="Remove">✕</button></div>`}).join('');
  d.innerHTML=`<div class="mb"><h3>Your cart ✿</h3>${rows}<div class="tot"><span>Total</span><b>${inr(tot)}${unk?' + more':''}</b></div><p class="fine">Nothing is charged here. Send me the order and I’ll confirm availability, delivery and payment in chat.</p><div class="mbb"><button class="btn" data-send>Send order on Instagram</button>${wa?'<button class="btn o2" data-wa>WhatsApp instead</button>':''}<button class="btn o2" data-clear>Clear</button><button class="btn o2" data-close>Close</button></div></div>`};
 d.onclick=e=>{const t=e.target;
  if(t===d||t.dataset.close!==undefined){d.remove();return}
  if(t.dataset.q){const[id,k]=t.dataset.q.split('|');cart[id]=Math.min(99,Math.max(0,(cart[id]||0)+ +k));if(!cart[id])delete cart[id];saveCart();updCart();draw()}
  if(t.dataset.rm){delete cart[t.dataset.rm];saveCart();updCart();draw()}
  if(t.dataset.clear!==undefined){cart={};saveCart();updCart();d.remove()}
  if(t.dataset.send!==undefined){const m=cartMsg();d.remove();askDM(m,dm(''))}
  if(t.dataset.wa!==undefined){window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(cartMsg()),'_blank')}};
 document.body.appendChild(d);draw();
}
function fit(){document.querySelectorAll('.ws .i p').forEach(p=>{const nx=p.nextElementSibling;if(nx&&nx.classList.contains('more'))nx.remove();const open=p.dataset.open==='1';p.classList.toggle('clamp',!open);const over=p.scrollHeight>p.clientHeight+1;if(open||over){const b=document.createElement('button');b.className='more';b.textContent=open?'Show less':'Read more';p.after(b)}})}
if(document.fonts)document.fonts.ready.then(fit);addEventListener('resize',fit);
function lb(src){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:20;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out';d.innerHTML='<img src="'+src+'" style="max-width:100%;max-height:100%;border-radius:12px">';d.onclick=()=>d.remove();document.body.appendChild(d)}
function publish(){
 const json=JSON.stringify(D).replace(/</g,'\\u003c');
 const html=SRC.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,(m,x,y)=>x+json+y);
 const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));l.download='index.html';document.body.appendChild(l);l.click();l.remove();
 $('#msg').textContent='Downloaded index.html. Now upload it to GitHub to go live.';
}
show();
canEdit=location.hash==='#edit'||/[?&]edit\b/.test(location.search);if(canEdit)view();goHash();
</script></body></html>
