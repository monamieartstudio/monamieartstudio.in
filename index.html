<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MonAmie Art Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6faf0;--card:#fff;--ink:#27302b;--mut:#66726a;--acc:#c9622b;--acc2:#8fa8d8;--line:#dfe8d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1715;--card:#272120;--ink:#f3e9df;--mut:#b3a498;--acc:#ec7a60;--acc2:#e9b44c;--line:#3a312d}}
:root[data-theme="dark"]{--bg:#1c1715;--card:#272120;--ink:#f3e9df;--mut:#b3a498;--acc:#ec7a60;--acc2:#e9b44c;--line:#3a312d}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif;margin:0}
a{color:inherit}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:700;text-decoration:none}.logo span{color:var(--acc)}
nav .l a{margin-left:16px;text-decoration:none;color:var(--mut);font-weight:500;font-size:14px}
nav .l a:hover{color:var(--acc)}
section{max-width:1000px;margin:0 auto;padding:44px 20px}
.hero{text-align:center;padding:48px 20px 36px}.mascot{width:110px;height:110px;border-radius:50%;margin-bottom:14px}.nl{width:32px;height:32px;border-radius:50%;vertical-align:middle;margin-right:8px}
.hero h1{font-size:clamp(34px,8vw,60px);line-height:1.1}.hero h1 em{color:var(--acc);font-style:italic}
.hero p{color:var(--mut);max-width:520px;margin:16px auto 24px}
.btn{display:inline-block;background:var(--acc);color:#fff;padding:10px 20px;border-radius:99px;text-decoration:none;font-weight:600;font-size:14px;border:0;cursor:pointer;font-family:inherit}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
h2{font-size:30px;margin-bottom:6px}.sub{color:var(--mut);margin:0 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:linear-gradient(135deg,var(--acc2),var(--acc));display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;opacity:.85}
.ph img,.card img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb small{color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.cb p{margin:0;color:var(--mut);font-size:14px;flex:1}.price{font-weight:600}
.cb .btn{margin-top:10px;text-align:center}
.ws{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;align-items:flex-start;flex-wrap:wrap}
.date{background:var(--acc);color:#fff;border-radius:10px;padding:8px 12px;text-align:center;min-width:64px;font-family:Fraunces,serif}
.date b{display:block;font-size:26px;line-height:1}.date span{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.ws .i{flex:1;min-width:200px}.ws h3{font-size:19px}.ws .m{color:var(--mut);font-size:14px}
.ws.past{opacity:.55}.empty{color:var(--mut);padding:20px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.about{display:grid;gap:24px;grid-template-columns:1fr}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 20px 60px;border-top:1px solid var(--line)}
/* edit mode */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--ink);color:var(--bg);display:none;gap:10px;align-items:center;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;font-size:14px}
#bar.on{display:flex}
.ed{background:var(--card);border:1px dashed var(--acc);border-radius:14px;padding:14px;margin-bottom:14px;display:grid;gap:8px}
.ed label{font-size:12px;color:var(--mut);display:grid;gap:3px}
.ed input,.ed textarea,.ed select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ed img{max-width:110px;border-radius:8px}.ed .x{background:none;border:0;color:#d33;cursor:pointer;justify-self:end;font:inherit}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style></head><body>
<div id="app"></div>
<div id="bar"><span id="msg">Editing mode — changes show after you tap Publish.</span><button class="btn" id="pub">Download updated file</button><button class="btn o" id="exit" style="color:var(--bg);border-color:var(--bg)">Exit</button></div>

const inp=(l,k,v,t='text')=>`<label>${l}<input type="${t}" data-k="${k}" value="${esc(v)}"></label>`;
function editor(){
 const imgf=(k,v)=>`${v?`<img src="${v}">`:''}<label>Photo<input type="file" accept="image/*" data-img="${k}"></label>`;
 $('#app').innerHTML=`<section><h2>Edit your site</h2><p class="sub">Change anything, then tap <b>Download updated file</b> at the bottom.</p>
 <div class="ed"><h3>Basics</h3>${inp('Tagline','tagline',D.tagline)}<label>About you<textarea rows="5" data-k="about">${esc(D.about)}</textarea></label>
 <div class="row">${inp('Instagram handle','socials.instagram',D.socials.instagram)}${inp('Pinterest handle','socials.pinterest',D.socials.pinterest)}${inp('Threads handle','socials.threads',D.socials.threads)}${inp('Email (optional)','socials.email',D.socials.email)}</div></div>
 <div class="sec-h"><h3>Shop items</h3><button class="btn" id="addp">+ Add item</button></div><br>
 ${D.products.map((p,i)=>`<div class="ed"><button class="x" data-delp="${i}">Delete</button><div class="row">${inp('Name',`products.${i}.name`,p.name)}${inp('Category (Paintings, Prints, Merch, Clay…)',`products.${i}.cat`,p.cat)}${inp('Price',`products.${i}.price`,p.price)}</div><label>Description<textarea rows="2" data-k="products.${i}.desc">${esc(p.desc)}</textarea></label>${inp('Buy link (optional — leave blank to use Instagram DM)',`products.${i}.link`,p.link)}${imgf(`products.${i}.img`,p.img)}</div>`).join('')}
 <div class="sec-h"><h3>Workshops</h3><button class="btn" id="addw">+ Add workshop</button></div><br>
 ${D.workshops.map((w,i)=>`<div class="ed"><button class="x" data-delw="${i}">Delete</button>${inp('Title',`workshops.${i}.title`,w.title)}<div class="row">${inp('Date',`workshops.${i}.date`,w.date,'date')}${inp('Time',`workshops.${i}.time`,w.time)}${inp('Place',`workshops.${i}.place`,w.place)}${inp('Price',`workshops.${i}.price`,w.price)}</div><label>Details<textarea rows="2" data-k="workshops.${i}.desc">${esc(w.desc)}</textarea></label>${inp('Booking link (optional)',`workshops.${i}.link`,w.link)}</div>`).join('')}
 <p class="sub">Past-dated workshops move to “Past workshops” automatically.</p></section>`;
}
function setK(k,v){const a=k.split('.');let o=D;while(a.length>1)o=o[a.shift()];o[a[0]]=v}
function show(){edit?editor():view();$('#bar').classList.toggle('on',edit)}
function shrink(f){return new Promise((res,rej)=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=u})}
document.addEventListener('click',e=>{const t=e.target;
 if(t.id==='go'){e.preventDefault();edit=true;show();scrollTo(0,0)}
 if(t.dataset.c){cat=t.dataset.c;view()}
 if(t.id==='addp'){D.products.unshift({id:uid('p'),name:'New item',cat:'Paintings',price:'',desc:'',img:'',link:''});show()}
 if(t.id==='addw'){D.workshops.unshift({id:uid('w'),title:'New workshop',date:today,time:'',place:'',price:'',desc:'',link:''});show()}
 if(t.dataset.delp&&confirm('Delete this item?')){D.products.splice(+t.dataset.delp,1);show()}
 if(t.dataset.delw&&confirm('Delete this workshop?')){D.workshops.splice(+t.dataset.delw,1);show()}
 if(t.id==='exit'){edit=false;show()}
 if(t.id==='pub')publish()});
document.addEventListener('input',e=>{if(e.target.dataset.k)setK(e.target.dataset.k,e.target.value)});
document.addEventListener('change',async e=>{const k=e.target.dataset.img;if(k&&e.target.files[0]){try{setK(k,await shrink(e.target.files[0]));show()}catch{alert('Could not read that image.')}}});
function publish(){
 const json=JSON.stringify(D).replace(/</g,'\\u003c');
 const html=SRC.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,(m,x,y)=>x+json+y);
 const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));l.download='index.html';document.body.appendChild(l);l.click();l.remove();
 $('#msg').textContent='Downloaded index.html — now upload it to GitHub to go live.';
}
show();
canEdit=/edit/.test(location.hash+location.search);if(canEdit)view();
</script></body></html>
